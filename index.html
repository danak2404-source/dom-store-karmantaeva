<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Store — Karmantaeva Dana</title>
  
  <!-- ВОТ ЗДЕСЬ ПОДКЛЮЧАЮТСЯ СТИЛИ -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Магазин товаров (DOM Store)</h1>

    <!-- Форма добавления -->
    <section class="card">
      <h2>Добавить новый товар</h2>
      <form id="add-product-form" novalidate>
        <div class="form-group">
          <label for="product-name">Название товара:</label>
          <input type="text" id="product-name" placeholder="Например, Яблоки">
          <span class="error-message" id="error-name"></span>
        </div>

        <div class="form-group">
          <label for="product-price">Цена (₸):</label>
          <input type="number" id="product-price" placeholder="Например, 500" step="0.01">
          <span class="error-message" id="error-price"></span>
        </div>

        <div class="form-group">
          <label for="product-qty">Количество:</label>
          <input type="number" id="product-qty" placeholder="Например, 3" step="1">
          <span class="error-message" id="error-qty"></span>
        </div>

        <button type="submit" class="btn btn-primary">Добавить товар</button>
      </form>
    </section>

    <!-- Список товаров -->
    <section class="card">
      <h2>Список товаров</h2>
      <table class="product-table">
        <thead>
          <tr>
            <th>Название</th>
            <th>Цена</th>
            <th>Количество</th>
            <th>Сумма</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="product-list">
          <!-- Товары будут добавляться сюда -->
        </tbody>
      </table>

      <div class="total-container">
        Итоговая стоимость: <span id="total-price">0</span> ₸
      </div>
    </section>
  </div>

  <!-- ВОТ ЗДЕСЬ ПОДКЛЮЧАЕТСЯ СКРИПТ (ПЕРЕД ЗАКРЫВАЮЩИМ ТЕГОМ </body>) -->
  <script src="app.js"></script>
</body>
</html>
